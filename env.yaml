# Cross-platform (Linux / Windows / macOS) conda environment for WildFL.
#
# Create with:  conda env create -f env.yaml
#
# NOTE: the `ultralytics` package is deliberately NOT included. Install your
# (custom/forked) ultralytics version separately, e.g.:
#   pip install -e /path/to/ultralytics --no-deps
# Its runtime dependencies (torch, opencv, pandas, seaborn, thop, ...) are
# already provided below, so `--no-deps` is safe.
#
# GPU notes:
#  - Linux: `pip install torch` pulls the CUDA 12.4 build automatically.
#  - Windows: pip installs the CPU build by default; for CUDA run
#      pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cu124
#  - macOS: CPU/MPS build (Apple Silicon only; torch 2.5 has no Intel-Mac wheels).
name: FL4Wildlife
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # core
      - numpy==1.26.4
      - torch==2.5.1
      - torchvision==0.20.1
      - opencv-python==4.10.0.84
      - pillow==11.1.0
      # tiled inference
      - sahi==0.11.36
      - shapely==2.0.7
      - pybboxes==0.1.6
      # data handling / evaluation output
      - pandas==2.2.3
      - openpyxl==3.1.5
      - scipy==1.15.2
      - pyyaml==6.0.2
      - requests==2.32.3
      - tqdm==4.67.1
      # plotting
      - matplotlib==3.10.0
      - seaborn==0.13.2
      # ultralytics runtime deps (needed when installing the fork with --no-deps)
      - ultralytics-thop==2.0.14
      - albumentations==1.0.3
      - psutil==7.0.0
      - py-cpuinfo==9.0.0
      # notebooks (example_usage.ipynb)
      - ipykernel==6.29.5
